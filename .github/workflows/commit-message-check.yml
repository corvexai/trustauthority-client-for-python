name: Commit Message Check

on:
  pull_request:
    types:
      - edited
      - opened
      - reopened
      - synchronize

jobs:
  commit-message-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check commit message
        uses: corvexai/gha-commit-message-check@ad377bf68220aa90d054998cd33340d990709a59 # v1.0.3
        with:
          mode: strict
          check_title: true
          check_commits: false
